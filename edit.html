<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit task — My todo</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
<header class="site-header">
    <div class="site-header-inner">
        <a class="site-name" href="index.html">My todo</a>
        <div class="account" hidden>
            <span class="account-email"></span>
            <button class="account-sign-out" type="button">Sign out</button>
        </div>
    </div>
</header>
<main class="page-main page-narrow">
    <h1 class="page-title">Edit task</h1>
    <form class="form">
        <div class="form-field">
            <input type="text" class="title input" placeholder="enter task"/>
        </div>
        <div class="form-field">
            <textarea class="textarea-task textarea description"></textarea>
        </div>
        <div class="error-container row error">
        </div>
        <div class="row">
            <button class="save-task-btn btn">save</button>
        </div>
    </form>
</main>
<footer class="site-footer">2025 alex@ukr.net</footer>
<script type="module" src="src/edit.js"></script>
<button class="page-action-btn">save</button>
</body>
</html>
