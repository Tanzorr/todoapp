<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in — My todo</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
<header class="site-header">
    <div class="site-header-inner">
        <a class="site-name" href="index.html">My todo</a>
    </div>
</header>
<main class="page-main page-narrow">
    <form class="auth-form" novalidate>
        <h1 class="page-title auth-heading">Sign in</h1>
        <div class="auth-field">
            <label class="auth-label" for="auth-email">Email</label>
            <input class="input auth-input" id="auth-email" name="email" type="email"
                   autocomplete="email" aria-describedby="auth-email-error"/>
            <p class="auth-field-error" id="auth-email-error"></p>
        </div>
        <div class="auth-field">
            <label class="auth-label" for="auth-password">Password</label>
            <input class="input auth-input" id="auth-password" name="password" type="password"
                   autocomplete="current-password"
                   aria-describedby="auth-password-hint auth-password-error"/>
            <p class="auth-hint" id="auth-password-hint"></p>
            <p class="auth-field-error" id="auth-password-error"></p>
        </div>
        <p class="auth-error" role="alert"></p>
        <div class="auth-actions">
            <button class="btn btn-ghost auth-switch" type="button">Create an account</button>
            <button class="btn btn-primary auth-submit" type="submit">Sign in</button>
        </div>
    </form>
</main>
<footer class="site-footer">2025 alex@ukr.net</footer>
<script type="module" src="src/login.js"></script>
</body>
</html>
